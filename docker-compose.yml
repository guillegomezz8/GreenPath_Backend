services:
  web:
    container_name: greenpath_backend
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/src
    ports:
      - "8000:8000"
    depends_on:
      -  my-postgres
    stdin_open: true
    tty: true

  my-postgres:
    image: postgis/postgis:15-3.3
    container_name: postgres_greenpath_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"

volumes:
  postgres_data: