services:
  web:
    container_name: django_project
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/src
    ports:
      - "8000:8000"
    env_file:
      - ./env/django.env
    depends_on:
      -  my-postgres
    stdin_open: true # for pdb
    tty: true # for pdb

  my-postgres:
    image: postgres:alpine
    container_name: postgres_django_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"

volumes:
  postgres_data: